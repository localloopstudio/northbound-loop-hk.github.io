 {id:'bay-sea',title:'蛇口看展＋海風約會',ports:['深圳灣'],hours:6,budget:680,people:['couple','friends','elder'],interests:['sea','culture','food'],travel:'30',area:'蛇口',walk:'低至中',why:'海邊、建築同晚餐集中，節奏舒服，約會感比行商場完整。',stops:[['海上世界文化藝術中心','先看建築及當期展覽，展覽須另查票務。'],['海濱外部空間','沿海慢行，日落時間按季節調整。'],['海上世界／蛇口晚餐','按預算選正餐，避免排隊過久。'],['返深圳灣口岸','預留跨境巴士或地鐵轉乘時間。']],note:'海邊遇雷雨或大風時改為室內展覽＋餐飲。'},

function home(){app.innerHTML=`<section class="hero"><div class="eyebrow">Hong Kong → Shenzhen · Route Finder</div><h1>北上深圳，<br><span>今日點玩？</span></h1><p class="lede">唔使再由幾十篇攻略自己砌行程。揀入口、時間、預算同想玩嘅嘢，幫你配一條即日可行的深圳路線。</p><div class="port-strip"><span>羅湖</span><span>福田</span><span>深圳灣</span><span>蓮塘</span><span>新皇崗 24H</span><span>高鐵深圳北</span></div><div class="ticket"><small>YOUR NORTHBOUND LOOP</small><h2>由過關嗰刻開始，<br>食、玩、休息、返程一次排好。</h2><p>7個選擇 · 約45秒 · 繁體中文</p></div><button class="primary" data-action="start">幫我安排今日 ↗</button><p class="fine">香港北上專屬版｜毋須登入，不收集個人資料。結果為路線建議，不包含人工定制或即時預約。</p></section>`}
function quiz(){const q=questions[step];app.innerHTML=`<section class="quiz"><button class="back" data-action="back">← 返回</button><div class="progress"><i style="width:${(step+1)/questions.length*100}%"></i></div><div class="eyebrow">${String(step+1).padStart(2,'0')} / ${questions.length}</div><h2>${q.title}</h2><div class="choices">${q.options.map(([v,l])=>`<button class="choice" data-value="${v}"><span>${l}</span><small>→</small></button>`).join('')}</div><p class="fine">${q.hint}</p></section>`}
const travelRank={near:0,'30':1,far:2};
function scoreRoute(r){let s=0;const h=+answers.hours,b=+answers.budget;
 if(r.ports.includes(answers.port))s+=6;else if(r.ports.length>2)s+=1;else s-=4;
 if(r.interests.includes(answers.interest))s+=5;
 if(r.people.includes(answers.people))s+=3;else s-=2;
 if(r.hours<=h)s+=3;else s-=Math.ceil((r.hours-h)/2)*3;
 if(r.budget<=b)s+=3;else s-=Math.ceil((r.budget-b)/150)*2;
 if(travelRank[r.travel]<=travelRank[answers.travel])s+=2;else s-=3;
 if(answers.return==='20'&&r.hours>6)s-=3;
 if(answers.return==='22'&&answers.port==='蓮塘'&&r.hours>6)s-=3;
 if(answers.return==='late'&&r.id==='huanggang-night')s+=4;
 return s}
function bestRoutes(){return routes.map(r=>({r,s:scoreRoute(r)})).sort((a,b)=>b.s-a.s).slice(0,3)}
let currentResult=0;
function result(idx=0){currentResult=idx;const ranked=bestRoutes(),{r,s}=ranked[idx],p=portInfo[answers.port];const changed=!r.ports.includes(answers.port);app.innerHTML=`<section class="result-head"><div class="eyebrow">YOUR NORTHBOUND LOOP</div><h1>今日，就去${r.area}。</h1><p class="match-note">${changed?`你揀的${answers.port}未有完全匹配，先推薦仍符合玩法、時間與預算的高分路線。需要另計跨區交通。`:r.why}</p></section><div class="ticket"><small>${answers.port}入境 · ${questions[3].options.find(x=>x[0]===answers.interest)[1]}</small><h2>${r.title}</h2><p>配對分數 ${Math.min(30,Math.max(0,s)+12)}／30 · 專屬建議</p></div><div class="meta"><div>當地遊玩<b>約 ${r.hours} 小時</b></div><div>人均預算<b>約 ¥${Math.max(200,r.budget-180)}–${r.budget}</b></div><div>主要片區<b>${r.area}</b></div><div>步行量<b>${r.walk}</b></div></div><div class="port-note"><small>你的返程入口</small><h3>${answers.port} · ${p.hours}</h3><div>${p.tip}</div></div><div class="route-card"><span class="tag">不走回頭路</span><span class="tag">含休息位</span><h3>今日路線</h3><div class="timeline">${r.stops.map((x,i)=>`<div class="stop"><div class="num">0${i+1}</div><div><strong>${x[0]}</strong><span>${x[1]}</span></div></div>`).join('')}</div><div class="alert">⚠ ${r.note}</div></div><div class="actions"><button class="primary" data-action="copy">複製今日路線</button><button class="secondary" data-action="next" data-index="${(idx+1)%ranked.length}">睇另一條 ↻</button><button class="secondary" data-action="restart">重新揀</button></div><p class="fine" id="msg">結果只保存在此頁，重新整理後會清除。</p>`;window.scrollTo({top:0,behavior:'smooth'})}
function copyRoute(){const {r}=bestRoutes()[currentResult];const txt=`${r.title}\n${r.stops.map((x,i)=>`${i+1}. ${x[0]}`).join('\n')}\n返程：${answers.port}（${portInfo[answers.port].hours}）\n出發前請確認營業、預約、交通及口岸安排。`;navigator.clipboard?.writeText(txt).then(()=>document.querySelector('#msg').textContent='路線已複製，可以發俾同行朋友。').catch(()=>document.querySelector('#msg').textContent='瀏覽器未能複製，請截圖保存。')}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.value!==undefined){answers[questions[step].key]=b.dataset.value;if(step<questions.length-1){step++;quiz()}else result()}else if(b.dataset.action==='start'||b.dataset.action==='restart'){step=0;answers={};quiz()}else if(b.dataset.action==='back'){if(step>0){step--;quiz()}else home()}else if(b.dataset.action==='next'){result(+b.dataset.index)}else if(b.dataset.action==='copy')copyRoute()});
home();
</script>
